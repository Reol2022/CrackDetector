# Anomalib v1.0 Config (Slim Version for 4GB GPU)
seed_everything: 42

data:
  class_path: anomalib.data.Folder
  init_args:
    name: tunnel_anomaly
    root: E:/Datasets/tunnel_anomaly
    normal_dir: train/good
    abnormal_dir: test/crack
    mask_dir: null
    normal_test_dir: null
    extensions: null
    
    augmentations:
      class_path: torchvision.transforms.v2.Compose
      init_args:
        transforms:
          - class_path: torchvision.transforms.v2.Resize
            init_args:
              size: [160, 160]
              antialias: true
          - class_path: torchvision.transforms.v2.ToDtype
            init_args:
              dtype: torch.float32
              scale: true
          - class_path: torchvision.transforms.v2.Normalize
            init_args:
              mean: [0.485, 0.456, 0.406]
              std: [0.229, 0.224, 0.225]
    
    train_batch_size: 1
    eval_batch_size: 1
    num_workers: 0
    
    val_split_mode: from_test
    val_split_ratio: 0.2

model:
  class_path: anomalib.models.Patchcore
  init_args:
    backbone: resnet18
    pre_trained: true
    layers: [layer3]
    coreset_sampling_ratio: 0.01
    num_neighbors: 9

trainer:
  accelerator: auto
  devices: 1
  # precision: 16 # Disable AMP to avoid "No inf checks were recorded" error with PatchCore
  max_epochs: 1
  limit_train_batches: 0.1 # Use 10% of data to prevent OOM on 4GB GPU
  default_root_dir: ./results
  callbacks:
    - class_path: anomalib.callbacks.ModelCheckpoint
      init_args:
        mode: max
        monitor: null # Disable monitoring since validation set lacks normal images (AUROC undefined)
        save_last: true
        save_top_k: 0
